influxdb:
  url: http://localhost:8086
  token: "<INFLUXDB_TOKEN>"
  org: default
  bucket: default

schema:
  name: mem
  tbname:
    prefix: node_
    count: 10
    from: 0
  columns:
    - name: ts
      type: timestamp
      start: now
      precision: ns
      step: 10000000000
    - name: total
      type: bigint
      min: 8000000000
      max: 8500000000
    - name: available
      type: bigint
      min: 2000000000
      max: 6000000000
    - name: used
      type: bigint
      min: 2000000000
      max: 6500000000
    - name: free
      type: bigint
      min: 500000000
      max: 4000000000
    - name: cached
      type: bigint
      min: 1000000000
      max: 4000000000
    - name: buffered
      type: bigint
      min: 50000000
      max: 300000000
    - name: used_percent
      type: float
      min: 20
      max: 85
    - name: available_percent
      type: float
      min: 15
      max: 80
  tags:
    - name: host
      type: binary(64)
      values: [node01, node02, node03, node04, node05, node06, node07, node08, node09, node10]
  generation:
    interlace: 1
    rows_per_table: 100
    rows_per_batch: 500

jobs:
  write-data:
    steps:
      - uses: influxdb/write
        with:
          concurrency: 2
          precision: ns
          batch_size: 500
          gzip: true
